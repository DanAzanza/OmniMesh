[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omnimesh"
version = "1.2.0"
description = "All-in-One 3D Mesh Optimization, Topology Sanitization, Skeletal Rigging, Real-Time LOD Simulation & Multi-Engine Pipeline"
readme = "README.md"
authors = [{ name = "Daniel" }]
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.22.0",
    "Pillow>=9.0.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.4.0",
    "pyright>=1.1.0",
    "fake-bpy-module-latest",
    "numpy>=1.22.0",
    "Pillow>=9.0.0",
]

[tool.setuptools.packages.find]
include = ["core*", "bridges*", "ui*", "exporters*"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "S", "B"]
ignore = ["E501", "E402", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S108", "S311", "S314"]
"scripts/*" = ["S101", "S108", "S110", "S310", "S311", "S602", "S603", "S607"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.pyright]
include = ["core", "ui", "exporters", "bridges", "tests"]
exclude = ["**/__pycache__", ".pytest_cache"]
pythonVersion = "3.10"
reportMissingImports = false
reportMissingModuleSource = false
reportGeneralTypeIssues = false
reportInvalidTypeForm = false
reportAssignmentType = false
reportAttributeAccessIssue = false
reportOptionalMemberAccess = false
reportOptionalCall = false
reportArgumentType = false
reportCallIssue = false
