name: OmniMesh Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  quality-gate:
    name: Quality Gate (Lint, Types, Tests)
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Full CI & Quality Gate (Deps, Ruff, Pyright, Pytest with Coverage)
        run: python scripts/verify_ci.py

  blender-tests:
    name: In-Blender Integration Tests (Headless Blender)
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Cache Portable Blender
        id: cache-blender
        uses: actions/cache@v4
        with:
          path: /opt/blender
          key: ${{ runner.os }}-blender-4.2.3-linux-x64

      - name: Download & Extract Blender 4.2 LTS
        if: steps.cache-blender.outputs.cache-hit != 'true'
        run: |
          sudo mkdir -p /opt/blender
          sudo chown -R $USER:$USER /opt/blender
          curl -sSL "https://download.blender.org/release/Blender4.2/blender-4.2.3-linux-x64.tar.xz" -o /tmp/blender.tar.xz
          tar -xJf /tmp/blender.tar.xz -C /opt/blender --strip-components=1
          rm -f /tmp/blender.tar.xz

      - name: Verify Blender Binary & Permissions
        run: |
          chmod +x /opt/blender/blender
          /opt/blender/blender --version

      - name: Build Extension Package for Installation Test
        run: python scripts/build_extension.py

      - name: Locate Extension Package
        id: extension_package
        run: echo "zip=$(pwd)/$(ls dist/omnimesh-v*.zip)" >> "$GITHUB_OUTPUT"

      - name: Run In-Blender Test Suite
        env:
          BLENDER_PATH: /opt/blender/blender
          OMNIMESH_EXTENSION_ZIP: ${{ steps.extension_package.outputs.zip }}
        run: python scripts/run_blender_tests.py

  build-and-release:
    name: Build and Publish Release
    needs: [quality-gate, blender-tests]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build Extension Package
        run: python scripts/build_extension.py

      - name: Create GitHub Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
          prerelease: true
