name: OmniMesh CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    name: CI (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    env:
      PYTHONPATH: .

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Ruff Linter
        run: python -m ruff check .

      - name: Run Ruff Formatter Check
        run: python -m ruff format --check .

      - name: Run Pyright Type Checker
        run: python -m pyright .

      - name: Run Pytest Test Suite with Coverage
        run: python -m pytest --cov=core --cov=exporters --cov=ui --cov=bridges --cov-report=term-missing -v

  blender-tests:
    name: In-Blender Integration Tests (Headless Blender)
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Cache Portable Blender
        id: cache-blender
        uses: actions/cache@v4
        with:
          path: /opt/blender
          key: ${{ runner.os }}-blender-5.0.0-linux-x64

      - name: Download & Extract Blender 5.0 LTS
        if: steps.cache-blender.outputs.cache-hit != 'true'
        run: |
          sudo mkdir -p /opt/blender
          sudo chown -R $USER:$USER /opt/blender
          curl -sSL "https://download.blender.org/release/Blender5.0/blender-5.0.0-linux-x64.tar.xz" -o /tmp/blender.tar.xz || curl -sSL "https://download.blender.org/release/Blender4.2/blender-4.2.3-linux-x64.tar.xz" -o /tmp/blender.tar.xz
          tar -xJf /tmp/blender.tar.xz -C /opt/blender --strip-components=1
          rm -f /tmp/blender.tar.xz

      - name: Verify Blender Binary & Permissions
        run: |
          chmod +x /opt/blender/blender
          /opt/blender/blender --version

      - name: Run In-Blender Test Suite
        env:
          BLENDER_PATH: /opt/blender/blender
        run: python scripts/run_blender_tests.py
