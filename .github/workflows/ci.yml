name: OmniMesh CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    name: CI (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]

    env:
      PYTHONPATH: .

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run CI Parity Gate (Deps, Ruff, Pyright, Audit, Pytest with Coverage)
        run: python scripts/verify_ci.py --skip-blender

  blender-tests:
    name: In-Blender Integration Tests (Headless Blender)
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies for Headless Blender
        run: |
          for i in 1 2 3; do
            sudo DEBIAN_FRONTEND=noninteractive apt-get update -o Acquire::Retries=3 && break || sleep 5
          done
          for i in 1 2 3; do
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends -o Acquire::Retries=3 \
              libegl1 libgl1 libglu1-mesa libxi6 libxcursor1 libxkbcommon0 libxxf86vm1 libxfixes3 libxrender1 libsm6 libxext6 && break || sleep 5
          done

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Cache Portable Blender
        id: cache-blender
        uses: actions/cache@v4
        with:
          path: /opt/blender
          key: ${{ runner.os }}-blender-5.3.0-linux-x64-v1

      - name: Download & Extract Blender 5.3
        if: steps.cache-blender.outputs.cache-hit != 'true'
        run: |
          sudo mkdir -p /opt/blender
          sudo chown -R $USER:$USER /opt/blender
          curl -fSL --retry 3 --retry-delay 5 "https://download.blender.org/release/Blender5.3/blender-5.3.0-linux-x64.tar.xz" -o /tmp/blender.tar.xz
          tar -xJf /tmp/blender.tar.xz -C /opt/blender --strip-components=1
          rm -f /tmp/blender.tar.xz

      - name: Verify Blender Binary & Permissions
        run: |
          chmod +x /opt/blender/blender
          /opt/blender/blender --version

      - name: Build Extension Package
        run: python scripts/build_extension.py

      - name: Run In-Blender Test Suite
        env:
          BLENDER_PATH: /opt/blender/blender
        run: python scripts/run_blender_tests.py --coverage

